name: Manual Build MPP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Patches (.mpp)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build MPP Bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:syncExtension :extensions:calculator:syncExtension :patches:buildAndroid generatePatchesList -x test

      - name: Upload MPP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gboard-patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.6.1
          name: "v4.6.1 - Gboard Web Clipboard TLS/HTTPS & Bonjour Discovery"
          body: "Release with default native TLS/HTTPS port 8081 advertising over mDNS/Bonjour for secure local sync."
          draft: false
          prerelease: false
          files: patches/build/libs/*.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
